name: AI Sandbox Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .sandbox/**
      - .github/workflows/ai-sandbox-image-build.yaml

concurrency:
  group: ai-sandbox-image-build
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Sandbox Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Image names must be lowercase, the repository owner is not.
      - name: Set image name
        run: echo "CI_REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/agent-sandbox" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only. Add linux/arm64 (and docker/setup-qemu-action) for Apple Silicon hosts.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./.sandbox
          file: ./.sandbox/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.CI_REGISTRY_IMAGE }}:latest
            ${{ env.CI_REGISTRY_IMAGE }}:${{ github.sha }}
